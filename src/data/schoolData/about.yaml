    #      Example: public/images/dean.webp
    #   2. Set the value below to just the filename:
    #        image: "dean.webp"
    #   3. Leave as "" to show a placeholder silhouette icon instead.
    image: "faculty/mikejo-perreras.webp"

# ---------------------------------------------------------------------------
# SCHOOL HISTORY & FUTURE DIRECTION
# ---------------------------------------------------------------------------
about:
    aboutTagline: "Preparing Future Criminal Justice Professionals"

    aboutText: "The Universidad de Dagupan School of Criminology offers a comprehensive and dynamic program designed to develop competent, ethical, and service-oriented criminal justice professionals. Grounded in both theoretical knowledge and practical application, the program equips students with essential skills in law enforcement, criminal investigation, forensic science, public safety, and crime prevention. It emphasizes discipline, leadership, critical thinking, and community engagement to prepare graduates for careers in policing, corrections, fire protection, security services, and other allied fields. Through qualified faculty, modern instructional approaches, and relevant training activities, the School of Criminology is committed to producing graduates who are responsive to the evolving demands of the criminal justice system and dedicated to upholding justice, integrity, and public trust."

    history:
        - "The Universidad de Dagupan School of Criminology is a premier academic unit committed to excellence in criminal justice education, training, and research. It provides a learner-centered environment that fosters academic rigor, professional discipline, and strong ethical values among its students."

        - "With a strong focus on holistic development, the School integrates classroom instruction with practical experiences such as drills, community immersion, and field training. It also actively supports the professional growth of its students through licensure examination preparation and values formation."

    future: "The School of Criminology is committed to continuously evolving its curriculum and programs to meet the demands of the rapidly changing global business environment. We envision a future where our graduates lead in the digital economy, drive sustainable business practices, and contribute to national development through ethical and innovative leadership."

    # Vision, mission, and core values
    vision: "It envisions to create and produce graduates with knowledge and skills in addressing the country’s criminal justice education and the character, competence to meet the challenges of globalization in the field of criminology."
    mission: "School of Criminology believes that through education and God’s providence can provide the community with professional, competent, and morally upright students capable of providing efficient and effective professional education, crime prevention, law enforcement, and public safety services."

    # Core values — each item needs a title, description, and icon name.
    # Available icons: Star, Shield, Lightbulb, Heart, Award, BookOpen, Users, Target
    coreValues:
        - title: "Objective 1"
          description: "To promote ‘Esprit de Corps’ or Camaraderie among Bachelor of Science in Criminology Students enrolled in the Institution."
          icon: "Star"
        - title: "Objective 2"
          description: "To uphold Courtesy, Discipline, Good Conduct, and Moral Values among Bachelor of Science in Criminology Students enrolled in the Institution."
          icon: "Award"
        - title: "Objective 3"
          description: "To encourage Bachelor of Science in Criminology Students to actively participate in the Institution’s Activities and Programs."
          icon: "Lightbulb"
        - title: "Objective 4"
          description: "To provide directives to Bachelor of Science in Criminology Students in assisting Security, Crowd Control, and Maintenance of Peace and Order on Activities and Programs being conducted by the Institution."
          icon: "Shield"
        - title: "Objective 5"
          description: "To instill volunteerism to Bachelor of Science in Criminology Students in doing charity works and activities for the noble practice of Public Service."
          icon: "BookOpen"
        - title: "Objective 6"
          description: "To enhance and develop Academic Competency, Knowledge, and Skills relevant to the Law Enforcement Field."
          icon: "Users"

    # Timeline — add or remove milestones as needed. Keep year as a 4-digit string.
    timeline:
        - year: "1982"
          event: "School of Criminology founded with BSA and BSBA programs"
        - year: "1990"
          event: "Achieved AACCUP Level I accreditation for the BSA program"
        - year: "1998"
          event: "Expanded to include Management Accounting program"
        - year: "2005"
          event: "Launched the Master in Business Administration program"
        - year: "2012"
          event: "Achieved AACCUP Level IV accreditation — highest level"
        - year: "2018"
          event: "Recognized as CHED Center of Development for Accountancy Education"
        - year: "2023"
          event: "Launched digital transformation initiative for business education"
