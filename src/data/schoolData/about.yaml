# DEAN'S MESSAGE
# ---------------------------------------------------------------------------
dean:
    name: "Dr. Maria Santos"
    title: "Dean, School of Business and Accountancy"
    message: "Welcome to the School of Business and Accountancy. Our programs are designed to cultivate critical thinking, ethical leadership, and professional excellence. We are proud of our graduates who have made significant contributions to the business and accounting profession both locally and internationally. I invite you to be part of our community of excellence."

    # HOW TO ADD THE DEAN'S PHOTO:
