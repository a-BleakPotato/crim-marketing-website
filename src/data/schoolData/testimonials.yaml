# =============================================================================
# TESTIMONIALS  (shown on the landing page)
# =============================================================================

# LAYOUT VARIANT — choose ONE:
#
#   cards    - Three-column grid of quote cards. Shows all testimonials.
#              Best when you have 3–6 quotes.
#
#   featured - One large highlighted quote shown prominently at the top,
#              with the remaining quotes listed in a smaller row below.
#              Best when you want one standout story.
#
variant: cards

# ---------------------------------------------------------------------------
# ALUMNI TESTIMONIALS
# ---------------------------------------------------------------------------
# HOW TO ADD A PHOTO:
#   1. Save the alumni photo inside the "public/images/testimonials/" folder.
#      Ideal size: 200×200 px, square crop. Format: WebP.
#      Example: public/images/testimonials/juan-dela-cruz.webp
#   2. Set the image value to just the filename with subfolder:
#        image: "testimonials/juan-dela-cruz.webp"
#   3. Leave as "" to show a placeholder icon.
testimonials:
    - name: "Ms. Verdida, J.A."
      program: "School of Criminology"
      batch: "20XX"
      quote: "Success not only reflects in personal dedication but also the nurturing environment and quality education. The passion, hard work, and determination truly embody the spirit of Universidad-Criminology and we are immensely proud of coming more accomplishments."
      image: "testimonials/verdida.webp"
      currentPosition: "Add current job position or role here"

    - name: "Mr. Saplan, Jules Danison"
      program: "School of Criminology"
      batch: "2023"
      quote: "My temple of learning, Universidad de Dagupan. This has given me a vast quantity of knowledge and assisted me in becoming the best possible version of myself. I'm blessed to be part of as the first batch of K12 and now as a graduating student of Criminology. (Tatag-Kalis class 2023-001)."
      image: "testimonials/saplan.webp"
      currentPosition: "Faculty Member, School of Criminology, Universidad de Dagupan"

    - name: "Ms. Biay, Mararac Jane"
      program: "School of Criminology"
      batch: "20XX"
      quote: "I have so many positive recollections from my time there that I genuienely belive this institution has improved. I had joy deep in me that I decided on this institution to pursue my academic goals and complete the desired course. All of the memories I have with this school will be treasured."
      image: "testimonials/biay.webp"
      currentPosition: "Add current job position or role here"
